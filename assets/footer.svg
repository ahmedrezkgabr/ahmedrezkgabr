<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 90" width="1280" height="90" role="img" aria-label="Solve, build, improve, repeat">
<style>
text{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace}
.f1{animation:fl 3.1s steps(1) infinite}
.f2{animation:fl 4.3s steps(1) infinite .7s}
.f3{animation:fl 2.7s steps(1) infinite 1.3s}
.f4{animation:fl 5.2s steps(1) infinite 2.1s}
@keyframes fl{0%,100%{opacity:1}40%{opacity:.15}55%{opacity:1}70%{opacity:.4}}
.blink{animation:bl 1.1s steps(1) infinite}
@keyframes bl{0%,50%{fill-opacity:1;opacity:1}50.01%,100%{fill-opacity:0;opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.w{fill:#8b9096;animation:hl 8s infinite}
.w1{animation-delay:2s}.w2{animation-delay:4s}.w3{animation-delay:6s}
@keyframes hl{0%,24%{fill:#3ecf73}25%,100%{fill:#8b9096}}
</style>
<rect width="1280" height="90" rx="8" fill="#131517"/>
<text x="640" y="40" text-anchor="middle" font-size="11" letter-spacing="4">
 <tspan fill="#3ecf73">/&gt;  </tspan><tspan class="w w0">SOLVE</tspan>  <tspan class="w w1">BUILD</tspan>  <tspan class="w w2">IMPROVE</tspan>  <tspan class="w w3">REPEAT</tspan></text>
<text x="640" y="62" text-anchor="middle" font-size="8" fill="#6b7076" letter-spacing="3">better software, a brighter tomorrow <tspan class="blink">_</tspan></text>
</svg>