<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 28" width="150" height="28" role="img" aria-label="realtime"><style>text{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace}
.f1{animation:fl 3.1s steps(1) infinite}.f2{animation:fl 4.3s steps(1) infinite .7s}.f3{animation:fl 2.7s steps(1) infinite 1.3s}
@keyframes fl{0%,100%{opacity:1}40%{opacity:.15}55%{opacity:1}70%{opacity:.4}}
.blink{animation:bl 1.1s steps(1) infinite}@keyframes bl{0%,50%{opacity:1}50.01%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="150" height="28" rx="5" fill="#131517"/><rect x="10" y="12" width="6" height="6" fill="#3ecf73"/><text x="24" y="21" font-size="12" fill="#c9cdd1" letter-spacing="1">realtime/</text></svg>